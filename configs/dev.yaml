# NeuroServe development configuration (paths are inside the dev container).
model:
  name: llama-3.2-1b-instruct               # the "model" value clients must send
  weights_dir: /models/llama-3.2-1b-instruct-fp16
  tokenizer_dir: /models/llama-3.2-1b-instruct
  chat_date_string: null                    # e.g. "26 Jul 2024" pins the template date (tests, benchmarks)

engine:
  max_prompt_tokens: 512
  num_pages: 2048                           # 2048 x 16 tokens x 32 KiB = 1 GiB of KV cache
  max_batch: 8
  max_batch_tokens: 512                     # tokens per engine step (prefill + decode); >= max_prompt_tokens
  max_pages_per_sequence: 64                # 1024 tokens per sequence (prompt + output)
  device_index: 0
  scheduling_policy: fcfs                  # fcfs | token-budget | decode-first | priority; see docs/scheduling.md
  priority_aging_ms: 1000                  # priority policy: +1 level per second of waiting

limits:
  default_max_tokens: 128                   # used when a request sets no max_tokens
  max_tokens_limit: 512                     # larger requests are rejected with 400

logging:
  level: INFO
  format: json                              # json (one object per line) or text
  log_prompts: false                        # never enable where prompts may contain personal data

server:
  host: 127.0.0.1                           # localhost only by default
  port: 8000
