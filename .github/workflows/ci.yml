name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu-build-and-test:
    name: CPU build + unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build cmake

      - name: Configure
        run: cmake --preset ci-cpu

      - name: Build
        run: cmake --build --preset ci-cpu -j

      - name: Test
        run: ctest --preset ci-cpu